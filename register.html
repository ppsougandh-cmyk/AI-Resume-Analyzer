{% extends 'base.html' %}

{% block title %}Create Account - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="custom-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="stat-icon-v2 success mx-auto mb-3" style="width: 68px; height: 68px;">
            <i class="bi bi-person-plus-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Create Account</h3>
          <p class="text-muted small">Start analyzing and optimizing your resume today</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
          
          <div class="mb-3">
            <label for="name" class="form-label text-muted small fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text input-group-text-v2">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" class="form-control form-control-v2" id="name" name="name" placeholder="John Doe" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text input-group-text-v2">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control form-control-v2" id="email" name="email" placeholder="john@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label text-muted small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text input-group-text-v2">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" class="form-control form-control-v2" id="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 btn-glow">
            <i class="bi bi-person-check me-2"></i> Register Account
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
          <p class="text-muted small mb-0">Already registered? 
            <a href="{{ url_for('login') }}" class="text-primary-light text-decoration-none fw-bold">Sign in here</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
