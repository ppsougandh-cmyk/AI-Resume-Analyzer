{% extends 'base.html' %}

{% block title %}Sign In - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="custom-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="pulse-loader mx-auto mb-3" style="width: 68px; height: 68px;">
            <i class="bi bi-shield-lock-fill fs-2 text-white"></i>
          </div>
          <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in to access your resume analysis dashboard</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
          
          <div class="mb-3">
            <label for="email" class="form-label text-muted small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text input-group-text-v2">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control form-control-v2" id="email" name="email" placeholder="name@example.com" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label text-muted small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text input-group-text-v2">
                <i class="bi bi-key"></i>
              </span>
              <input type="password" class="form-control form-control-v2" id="password" name="password" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3 btn-glow">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
          <p class="text-muted small mb-0">Don't have an account? 
            <a href="{{ url_for('register') }}" class="text-primary-light text-decoration-none fw-bold">Create one here</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
